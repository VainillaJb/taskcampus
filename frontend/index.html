<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCampus 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .heading-font {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-slate-50 via-sky-50/40 to-slate-100 min-h-screen text-slate-800 antialiased pb-12">

    <header class="border-b border-sky-100/80 bg-white/70 backdrop-blur-md sticky top-0 z-50 px-6 py-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🚀</span>
                <h1 class="heading-font text-2xl font-bold tracking-tight text-slate-900">
                    Task<span class="text-sky-600 font-extrabold">Campus</span>
                </h1>
            </div>
            <div class="flex items-center gap-3 border-l border-slate-200 pl-4">
                <div class="w-9 h-9 rounded-full bg-sky-600/10 border border-sky-200 flex items-center justify-center text-sky-700 font-semibold text-xs">
                    CB
                </div>
                <span class="text-xs text-slate-400 font-medium hidden sm:inline">See you space cowboy...</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm transition hover:shadow-md">
                <h2 id="form-title" class="heading-font text-lg font-bold text-slate-900 mb-5 flex items-center gap-2">
                    📝 Registrar Nueva Tarea
                </h2>
                
                <form id="task-form" class="space-y-4">
                    <input type="hidden" id="task-id">
                    
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Título de la Actividad</label>
                        <input type="text" id="titulo" required placeholder="Ej. Implementar API REST" class="w-full px-3.5 py-2 rounded-xl bg-slate-50/50 border border-slate-200 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Asignatura / Sujeto</label>
                        <input type="text" id="asignatura" required placeholder="Ej. Sistemas Distribuidos" class="w-full px-3.5 py-2 rounded-xl bg-slate-50/50 border border-slate-200 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Descripción</label>
                        <textarea id="descripcion" rows="3" required placeholder="Detalles de la entrega académica..." class="w-full px-3.5 py-2 rounded-xl bg-slate-50/50 border border-slate-200 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Fecha de Entrega</label>
                        <input type="date" id="fecha_entrega" required class="w-full px-3.5 py-2 rounded-xl bg-slate-50/50 border border-slate-200 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Prioridad</label>
                            <select id="prioridad" class="w-full px-3.5 py-2 rounded-xl bg-slate-50/50 border border-slate-200 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition">
                                <option value="baja">🟢 Baja</option>
                                <option value="media">🟡 Media</option>
                                <option value="alta">🔴 Alta</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Estado</label>
                            <select id="estado" class="w-full px-3.5 py-2 rounded-xl bg-slate-50/50 border border-slate-200 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition">
                                <option value="pendiente">⏳ Pendiente</option>
                                <option value="en proceso">⚙️ En Proceso</option>
                                <option value="finalizada">✅ Finalizada</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-2 flex flex-col gap-2">
                        <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition shadow-sm shadow-sky-200 cursor-pointer">
                            Guardar Tarea
                        </button>
                        <button type="button" id="btn-cancel" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 px-4 rounded-xl text-xs transition hidden cursor-pointer">
                            Cancelar Edición
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="lg:col-span-7 space-y-6">
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total</p>
                    <p id="stat-total" class="heading-font text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-amber-50/40 border border-amber-100/70 p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs font-bold uppercase tracking-wider text-amber-600/80">Pendientes</p>
                    <p id="stat-pendientes" class="heading-font text-2xl font-bold text-amber-700 mt-1">0</p>
                </div>
                <div class="bg-emerald-50/40 border border-emerald-100/70 p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs font-bold uppercase tracking-wider text-emerald-600/80">Terminadas</p>
                    <p id="stat-finalizadas" class="heading-font text-2xl font-bold text-emerald-700 mt-1">0</p>
                </div>
                <div class="bg-rose-50/40 border border-rose-100/70 p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs font-bold uppercase tracking-wider text-rose-600/80">Prioridad Alta</p>
                    <p id="stat-alta" class="heading-font text-2xl font-bold text-rose-700 mt-1">0</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                    <h2 class="heading-font text-lg font-bold text-slate-900 flex items-center gap-2">
                        📋 Listado de Tareas
                    </h2>
                    
                    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                        <select id="filter-estado" class="bg-slate-50 border border-slate-200 text-xs px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-sky-500">
                            <option value="todos">🔍 Todos los estados</option>
                            <option value="pendiente">⏳ Pendientes</option>
                            <option value="en proceso">⚙️ En Proceso</option>
                            <option value="finalizada">✅ Finalizadas</option>
                        </select>
                        <select id="filter-prioridad" class="bg-slate-50 border border-slate-200 text-xs px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-sky-500">
                            <option value="todos">🔥 Todas las prioridades</option>
                            <option value="baja">🟢 Baja</option>
                            <option value="media">🟡 Media</option>
                            <option value="alta">🔴 Alta</option>
                        </select>
                        <input id="filter-asignatura" type="text" placeholder="Buscar asignatura..." class="bg-slate-50 border border-slate-200 text-xs px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-sky-500" />
                    </div>
                </div>

                <div id="tasks-container" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    </div>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
